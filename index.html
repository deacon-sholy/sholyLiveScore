<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b1120'/><path d='M16 6L18 14H26L20 18L22 26L16 20L10 26L12 18L6 14H14L16 6Z' fill='%2310b981'/></svg>" />
    <!-- viewport-fit=cover lets the page paint under the notch / gesture bar;
         src/index.css adds the insets back to the pinned header and the page
         wrapper. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sholy Livescore · Live Football Scores</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sholy Livescore" />
    <meta property="og:title" content="Sholy Livescore" />
    <meta property="og:description" content="Live football scores, stats & match events" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sholy Livescore" />
    <meta name="description" content="Live football scores, standings, stats & match events for leagues and international competitions around the world." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sholy Scores" />
    <meta name="theme-color" content="#070b14" id="theme-color-meta" />
    <script>
      // Apply the stored theme before first paint so the page never flashes
      // the wrong palette while React boots.
      (function () {
        var DARK = '#070b14';
        var LIGHT = '#f7f9fc';
        function paint(dark) {
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', dark ? DARK : LIGHT);
        }
        try {
          var stored = localStorage.getItem('theme');
          paint(stored ? stored === 'dark' : true);
        } catch (e) {
          paint(true);
        }
        // Keep the browser chrome in sync when the toggle flips the theme.
        window.addEventListener('themechange', function (e) {
          paint(!!(e.detail && e.detail.dark));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
